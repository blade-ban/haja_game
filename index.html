<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한자 GO: 구역별 탐험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; font-family: 'Pretendard', sans-serif; }
        #camera-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.9; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .interactive { pointer-events: auto; }
        .passthrough { pointer-events: none; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 10px rgba(250,204,21,0.5); } 50% { box-shadow: 0 0 40px rgba(250,204,21,1); } 100% { box-shadow: 0 0 10px rgba(250,204,21,0.5); } }
        .target-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float 3s ease-in-out infinite; display: none; transition: left 0.1s ease-out, opacity 0.2s; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); pointer-events: auto; cursor: pointer; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white select-none">

    <video id="camera-bg" autoplay playsinline muted></video>

    <div id="screen-login" class="layer bg-slate-900 flex flex-col items-center justify-center interactive z-50 px-6">
        <h1 class="text-5xl font-black text-yellow-400 mb-2 drop-shadow-lg tracking-tighter">한자 GO</h1>
        <p class="text-lg text-blue-300 font-bold tracking-widest mb-8">내 위치 기반 탐험</p>
        
        <div class="w-full max-w-sm bg-slate-800 p-8 rounded-3xl shadow-[0_0_30px_rgba(30,58,138,0.5)] border border-slate-700">
            <input type="number" id="input-id" placeholder="학번 (예: 1101)" class="w-full bg-slate-700 text-white rounded-xl p-4 text-xl mb-4 font-bold text-center placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500" pattern="[0-9]*" inputmode="numeric">
            <input type="text" id="input-name" placeholder="이름 (예: 홍길동)" class="w-full bg-slate-700 text-white rounded-xl p-4 text-xl mb-6 font-bold text-center placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500">
            
            <div id="loading-msg" class="text-yellow-400 text-center font-bold text-sm mb-4 hidden">
                <i class="fas fa-spinner fa-spin mr-2"></i>데이터를 불러오는 중...
            </div>
            
            <button id="btn-login" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-2xl py-4 rounded-xl shadow-lg transition transform active:scale-95 disabled:opacity-50">
                탐험 시작하기
            </button>
        </div>
        <p class="mt-8 text-xs text-slate-500">실외에서 플레이하실 경우 GPS가 필요합니다.</p>
    </div>

    <div id="screen-dashboard" class="layer bg-slate-900 interactive z-40 hidden flex-col">
        <div class="p-6 bg-slate-800 rounded-b-3xl shadow-lg flex justify-between items-center border-b border-slate-700">
            <div>
                <h2 id="dash-user" class="text-2xl font-black text-white"></h2>
                <p id="dash-total-score" class="text-yellow-400 font-bold text-sm">총 발견 한자: 0개</p>
            </div>
            <button id="btn-logout" class="bg-red-500/20 text-red-400 font-bold px-4 py-2 rounded-lg text-sm">로그아웃</button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="zone-list">
            <!-- 구역 카드가 자바스크립트로 생성됩니다. -->
        </div>
    </div>

    <!-- 설정 모달창 (구역 진입 전) -->
    <div id="modal-settings" class="layer interactive z-50 hidden bg-black/80 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-700 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
            <h2 id="settings-zone-name" class="text-2xl font-black text-white text-center mb-6">구역 설정</h2>
            
            <div class="space-y-6">
                <div>
                    <p class="text-sm font-bold text-slate-400 mb-2">어디에서 진행하시나요?</p>
                    <div class="flex gap-2">
                        <button id="btn-mode-out" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl border-2 border-transparent transition">실외 (GPS 맵)</button>
                        <button id="btn-mode-in" class="flex-1 py-3 bg-slate-700 text-slate-300 font-bold rounded-xl border-2 border-transparent transition">실내 (고정 화면)</button>
                    </div>
                </div>
                
                <div>
                    <p class="text-sm font-bold text-slate-400 mb-2 text-center">제한 시간 (분)</p>
                    <div class="flex items-center justify-center gap-4">
                        <button id="btn-time-down" class="w-12 h-12 bg-slate-700 rounded-full font-black text-2xl flex items-center justify-center active:bg-slate-600">-</button>
                        <span id="time-display" class="text-4xl font-black text-yellow-400 w-16 text-center">3</span>
                        <button id="btn-time-up" class="w-12 h-12 bg-slate-700 rounded-full font-black text-2xl flex items-center justify-center active:bg-slate-600">+</button>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-3 mt-8">
                <button id="btn-cancel-zone" class="flex-1 bg-slate-600 text-white font-bold py-4 rounded-xl active:bg-slate-500">취소</button>
                <button id="btn-start-zone" class="flex-1 bg-green-500 text-white font-black py-4 rounded-xl active:bg-green-400 shadow-lg shadow-green-500/30">입장하기</button>
            </div>
        </div>
    </div>

    <div id="screen-ar" class="layer passthrough z-30 hidden">
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start interactive">
            <button id="btn-exit" class="bg-red-500/80 backdrop-blur text-white font-bold px-4 py-2 rounded-full shadow-lg border border-red-400/50">
                <i class="fas fa-sign-out-alt mr-2"></i>포기
            </button>
            
            <div class="flex flex-col items-end gap-2">
                <div class="bg-slate-900/80 backdrop-blur rounded-2xl p-3 border border-slate-700 shadow-lg text-right min-w-[120px]">
                    <p class="text-xs text-slate-400 font-bold mb-1">남은 시간</p>
                    <p id="timer" class="text-3xl font-black text-white font-mono">03:00</p>
                </div>
                <div class="bg-slate-900/80 backdrop-blur rounded-full px-4 py-2 border border-slate-700 shadow-lg flex items-center gap-2">
                    <i class="fas fa-star text-yellow-400"></i>
                    <p id="score" class="font-black text-white text-lg">0 / 0</p>
                </div>
            </div>
        </div>

        <div id="ar-container" class="absolute top-0 left-0 w-full h-full"></div>
        <div id="radar" class="absolute bottom-6 right-6 w-32 h-32 bg-slate-900/80 backdrop-blur rounded-full border-2 border-blue-500/50 shadow-[0_0_20px_rgba(59,130,246,0.3)] hidden interactive">
            <div class="absolute top-1/2 left-1/2 w-2 h-2 bg-blue-400 rounded-full transform -translate-x-1/2 -translate-y-1/2 shadow-[0_0_5px_#60a5fa]"></div>
            <div class="absolute top-0 left-1/2 w-[1px] h-full bg-blue-500/30"></div>
            <div class="absolute top-1/2 left-0 w-full h-[1px] bg-blue-500/30"></div>
            <div id="radar-dots" class="absolute top-0 left-0 w-full h-full"></div>
        </div>

        <div id="debug-info" class="absolute bottom-6 left-6 bg-black/50 p-2 rounded text-xs text-green-400 font-mono hidden">
            컴퍼스 대기중...
        </div>
    </div>

    <!-- 획득 화면 (포켓몬 획득 화면 스타일) -->
    <div id="screen-capture" class="layer interactive z-50 hidden bg-black/90 flex flex-col items-center justify-center p-6 backdrop-blur-md">
        <h2 class="text-3xl font-black text-yellow-400 mb-8 drop-shadow-lg tracking-widest animate-bounce">발견!</h2>
        
        <div class="bg-slate-800 p-8 rounded-full border-4 border-yellow-400 shadow-[0_0_50px_rgba(250,204,21,0.6)] w-64 h-64 flex flex-col items-center justify-center mb-10" style="animation: pulse-glow 2s infinite;">
            <p id="cap-hanja" class="text-8xl font-black text-white leading-none mb-2"></p>
        </div>
        
        <div class="text-center mb-12">
            <p id="cap-meaning" class="text-4xl font-black text-blue-300 mb-2"></p>
            <p class="text-slate-400 font-bold text-lg">기록되었습니다!</p>
        </div>
        
        <button id="btn-cap-close" class="bg-yellow-400 text-slate-900 font-black text-2xl py-4 px-12 rounded-full active:bg-yellow-500 transition shadow-[0_5px_0_#ca8a04] active:shadow-[0_0px_0_#ca8a04] active:translate-y-[5px]">
            계속 탐험하기
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoMPp5TqB11AIrmkhhtptPxX5fcvZja1k_iLiE4PI_Ak7MQ5zTWVP8BRmf7UzNJPiCVA/exec";

            state: {
                studentId: null,
                studentName: null,
                hanjaDB: {},       
                userProgress: {},  
                currentZoneId: null,
                currentZoneDB: [],
                gameTargets: [],
                heading: 0,
                myLat: 0,
                myLng: 0,
                isOutdoor: true,
                timeLimitMins: 3,
                timeRemaining: 0,
                timerInterval: null,
                isGameRunning: false
            },

                get: (id) => document.getElementById(id),
                show: (id) => document.getElementById(id).classList.remove('hidden'),
                hide: (id) => document.getElementById(id).classList.add('hidden')
            },
