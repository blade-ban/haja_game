<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>한자 GO: 구역별 탐험</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>

        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; font-family: 'Pretendard', sans-serif; }

        #camera-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.9; }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        .interactive { pointer-events: auto; }

        .passthrough { pointer-events: none; }

        @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }

        @keyframes pulse-glow { 0% { box-shadow: 0 0 10px rgba(250,204,21,0.5); } 50% { box-shadow: 0 0 40px rgba(250,204,21,1); } 100% { box-shadow: 0 0 10px rgba(250,204,21,0.5); } }

        .target-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: float 3s ease-in-out infinite; display: none; transition: left 0.1s ease-out, opacity 0.2s; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); pointer-events: auto; cursor: pointer; }

        ::-webkit-scrollbar { display: none; }

    </style>

</head>

<body class="text-white select-none">



    <video id="camera-bg" autoplay playsinline muted></video>



    <div id="screen-login" class="layer bg-slate-900 flex flex-col items-center justify-center interactive z-50 px-6">

        <h1 class="text-5xl font-black text-yellow-400 mb-2 drop-shadow-lg tracking-tighter">한자 GO</h1>

        <p class="text-lg text-blue-300 font-bold tracking-widest mb-8">내 위치 기반 탐험</p>

        

        <div class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">

            <p id="loading-msg" class="text-center text-yellow-400 font-bold mb-4 animate-pulse"><i class="fas fa-spinner fa-spin mr-2"></i>지도 데이터를 불러오는 중...</p>

            

            <div id="input-form" class="hidden space-y-4">

                <div>

                    <label class="block text-sm text-gray-300 mb-1 font-bold">학번</label>

                    <input type="number" id="input-id" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-3 outline-none focus:border-blue-500" placeholder="예: 10101">

                </div>

                <div>

                    <label class="block text-sm text-gray-300 mb-1 font-bold">이름</label>

                    <input type="text" id="input-name" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-3 outline-none focus:border-blue-500" placeholder="예: 홍길동">

                </div>

                <button onclick="app.login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xl py-4 rounded-xl shadow-lg transform transition active:scale-95 mt-4">

                    내 현황 보기

                </button>

            </div>

        </div>

    </div>



    <div id="screen-dashboard" class="layer bg-slate-900 hidden flex-col interactive z-50 overflow-y-auto pb-10">

        <div class="p-5 bg-slate-800 flex flex-col justify-center items-center border-b border-slate-700 sticky top-0 z-10 shadow-md">

            <h2 class="text-xl font-bold text-white mb-1" id="dash-student-info">10101 홍길동</h2>

            <p class="text-sm text-yellow-400 font-bold">탐험 진행 상황</p>

        </div>

        

        <div class="p-5 space-y-4" id="zone-list-container">

            </div>

    </div>



    <div id="screen-game" class="layer hidden passthrough">

        <div class="absolute top-0 w-full p-4 flex justify-between items-start interactive">

            <div class="bg-black/60 backdrop-blur-md rounded-2xl p-3 border border-white/10 flex items-center space-x-3">

                <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-slate-900 font-black text-xl" onclick="app.exitZone()" style="cursor:pointer;">

                    <i class="fas fa-arrow-left"></i>

                </div>

                <div>

                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider" id="current-zone-display">구역명</div>

                    <div class="text-xl font-black text-white" id="score-display">0 <span class="text-sm font-normal text-gray-300" id="total-display">/ 0</span></div>

                </div>

            </div>

            <div class="bg-black/60 backdrop-blur-md rounded-xl p-3 border border-white/10 text-center min-w-[120px]">

                <div class="text-[10px] text-gray-400 font-bold mb-1">진행 시간</div>

                <div id="timer-display" class="text-lg font-bold text-blue-400">00:00</div>

                <div class="text-[10px] text-gray-500 mt-1" id="gps-status">위치 확인 중...</div>

            </div>

        </div>

        <div id="ar-container" class="absolute inset-0 passthrough"></div>

    </div>



    <div id="modal-capture" class="hidden absolute inset-0 z-[60] bg-black/80 backdrop-blur-md flex items-center justify-center interactive">

        <div class="bg-slate-800 w-10/12 max-w-sm rounded-[2rem] p-1 pt-8 relative border border-slate-600 shadow-2xl" id="capture-box">

            <div class="bg-slate-900 rounded-[1.8rem] p-6 text-center">

                <div class="inline-block bg-yellow-500/20 text-yellow-300 px-4 py-1 rounded-full text-sm font-bold mb-4">한자 포획!</div>

                <div id="cap-hanja" class="text-8xl font-black text-white mb-4">學</div>

                <div class="bg-slate-800 rounded-2xl p-4 mb-4 border border-slate-700 text-left space-y-2">

                    <div class="flex items-center"><span class="text-gray-400 w-12 text-sm font-bold">음/뜻</span><span id="cap-hun-eum" class="text-xl font-black text-blue-400 ml-2">배울 학</span></div>

                    <div class="h-px w-full bg-slate-700"></div>

                    <div class="flex items-center"><span class="text-gray-400 w-12 text-sm font-bold">부수</span><span id="cap-busu" class="text-lg font-bold text-yellow-400 ml-2">子</span></div>

                </div>

                <button onclick="app.closeCaptureModal()" class="w-full py-4 bg-yellow-500 text-slate-900 font-bold text-lg rounded-xl shadow-lg active:scale-95 transition">계속 탐험하기</button>

            </div>

        </div>

    </div>



    <div id="screen-finish" class="hidden absolute inset-0 z-[70] bg-slate-900 flex-col items-center justify-center interactive px-6 text-center">

        <i class="fas fa-trophy text-7xl text-yellow-400 mb-6 drop-shadow-[0_0_20px_rgba(250,204,21,0.6)]"></i>

        <h2 class="text-4xl font-black text-white mb-2">구역 탐험 완료!</h2>

        <p class="text-gray-300 mb-8" id="finish-msg">이 구역의 모든 한자를 포획했습니다.</p>

        

        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm border border-slate-700 text-left space-y-4 mb-8">

            <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-gray-400">완료 구역</span><span class="font-bold text-white" id="finish-zone">1층</span></div>

            <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-gray-400">걸린 시간</span><span class="font-bold text-yellow-400" id="finish-elapsed">03분 15초</span></div>

            <div class="flex justify-between pb-2"><span class="text-gray-400">기록 전송</span><span class="font-bold text-blue-400 text-sm" id="save-status">전송 중...</span></div>

        </div>

        

        <button onclick="app.returnToDashboard()" class="w-full bg-blue-600 text-white font-bold text-xl py-4 rounded-xl shadow-lg active:scale-95 transition">

            현황판으로 돌아가기

        </button>

    </div>



    <script>

        // ★★★ 여기에 복사한 구글 웹 앱 URL을 붙여넣으세요 ★★★

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoMPp5TqB11AIrmkhhtptPxX5fcvZja1k_iLiE4PI_Ak7MQ5zTWVP8BRmf7UzNJPiCVA/exec";

        

        const GeoUtils = {

            getDistance: function(lat1, lon1, lat2, lon2) {

                const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;

                const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;

                const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);

                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            },

            getBearing: function(lat1, lon1, lat2, lon2) {

                const dl = (lon2-lon1) * Math.PI/180;

                const y = Math.sin(dl) * Math.cos(lat2 * Math.PI/180);

                const x = Math.cos(lat1 * Math.PI/180)*Math.sin(lat2 * Math.PI/180) - Math.sin(lat1 * Math.PI/180)*Math.cos(lat2 * Math.PI/180)*Math.cos(dl);

                return (Math.atan2(y, x)*180/Math.PI + 360) % 360;

            }

        };



        const app = {

            state: {

                fullHanjaDB: [], currentZoneDB: [], gameTargets: [], 

                selectedZone: '', studentId: '', studentName: '', isOutdoor: false,

                startTime: null, timerInterval: null, elapsedSeconds: 0,

                currentLat: null, currentLng: null, startLat: null, startLng: null,

                compassHeading: 0, watchId: null, isModalOpen: false, 

                

                // 학생의 기기에 포획 기록을 저장 (새로고침해도 유지됨)

                userProgress: JSON.parse(localStorage.getItem('hanjaGoProgress')) || {}

            },

            ui: {

                screenLogin: document.getElementById('screen-login'), screenDashboard: document.getElementById('screen-dashboard'),

                screenGame: document.getElementById('screen-game'), screenFinish: document.getElementById('screen-finish'), 

                arContainer: document.getElementById('ar-container'), timerDisplay: document.getElementById('timer-display'), 

                scoreDisplay: document.getElementById('score-display'), totalDisplay: document.getElementById('total-display'), 

                gpsStatus: document.getElementById('gps-status')

            },



            init: function() {

                this.startCamera();

                this.fetchHanjaDB();

                

                // 이전에 로그인한 기록이 있으면 자동 채우기

                const savedId = localStorage.getItem('hanjaGoId');

                const savedName = localStorage.getItem('hanjaGoName');

                if(savedId && savedName) {

                    document.getElementById('input-id').value = savedId;

                    document.getElementById('input-name').value = savedName;

                }

            },



            startCamera: async function() {

                try {

                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });

                    document.getElementById('camera-bg').srcObject = stream;

                } catch(e) { document.getElementById('camera-bg').style.background = '#1e293b'; }

            },



            fetchHanjaDB: function() {

                fetch(SCRIPT_URL + "?action=getHanja")

                    .then(res => res.json())

                    .then(data => {

                        this.state.fullHanjaDB = data;

                        document.getElementById('loading-msg').style.display = 'none';

                        document.getElementById('input-form').classList.remove('hidden');

                    })

                    .catch(err => {

                        document.getElementById('loading-msg').innerHTML = "데이터 불러오기 실패. 인터넷 연결을 확인해주세요.";

                    });

            },



            login: function() {

                const id = document.getElementById('input-id').value.trim();

                const name = document.getElementById('input-name').value.trim();

                if(!id || !name) return alert("학번과 이름을 입력해주세요!");



                this.state.studentId = id;

                this.state.studentName = name;

                

                // 로그인 정보 저장

                localStorage.setItem('hanjaGoId', id);

                localStorage.setItem('hanjaGoName', name);



                const userKey = `${id}_${name}`;

                if (!this.state.userProgress[userKey]) {

                    this.state.userProgress[userKey] = []; // 해당 학생의 포획 기록(ID) 배열 생성

                }



                this.ui.screenLogin.classList.add('hidden');

                this.showDashboard();

            },



            // --- 대시보드 (현황판) 렌더링 ---

            showDashboard: function() {

                this.ui.screenDashboard.classList.remove('hidden');

                this.ui.screenDashboard.classList.add('flex');

                document.getElementById('dash-student-info').innerText = `${this.state.studentId} ${this.state.studentName}`;

                

                const container = document.getElementById('zone-list-container');

                container.innerHTML = ''; // 초기화



                const userKey = `${this.state.studentId}_${this.state.studentName}`;

                const caughtIds = this.state.userProgress[userKey];



                const zones = [...new Set(this.state.fullHanjaDB.map(item => item.zone))];

                

                zones.forEach(zone => {

                    const zoneHanja = this.state.fullHanjaDB.filter(h => h.zone === zone);

                    const totalCount = zoneHanja.length;

                    // 이 구역 한자 중 내가 잡은 한자의 개수 파악

                    const caughtCount = zoneHanja.filter(h => caughtIds.includes(h.id)).length;

                    const isCompleted = caughtCount >= totalCount;



                    const div = document.createElement('div');

                    div.className = `p-5 rounded-2xl border ${isCompleted ? 'bg-green-800/80 border-green-500' : 'bg-slate-800 border-slate-600'} flex justify-between items-center shadow-lg`;

                    

                    const percent = Math.round((caughtCount / totalCount) * 100) || 0;

                    

                    div.innerHTML = `

                        <div class="flex-1">

                            <h3 class="text-xl font-black text-white mb-1">${zone} ${isCompleted ? '<i class="fas fa-check-circle text-green-400 ml-1"></i>' : ''}</h3>

                            <div class="w-full bg-slate-900 rounded-full h-2.5 mb-1 mt-2">

                              <div class="bg-yellow-400 h-2.5 rounded-full" style="width: ${percent}%"></div>

                            </div>

                            <p class="text-sm text-gray-400">${caughtCount}개 / 총 ${totalCount}개 포획</p>

                        </div>

                        <div class="ml-4">

                            ${isCompleted 

                                ? `<button disabled class="bg-slate-700 text-gray-400 px-4 py-3 rounded-xl font-bold">완료됨</button>` 

                                : `<button onclick="app.startZone('${zone}')" class="bg-yellow-500 text-slate-900 active:bg-yellow-400 px-5 py-3 rounded-xl font-bold shadow-md transform active:scale-95 transition">탐험하기</button>`

                            }

                        </div>

                    `;

                    container.appendChild(div);

                });

            },



            // --- 게임(구역) 시작 ---

            startZone: function(zoneName) {

                this.state.selectedZone = zoneName;

                this.state.isOutdoor = zoneName.includes('외부') || zoneName.includes('운동장');

                this.state.currentZoneDB = this.state.fullHanjaDB.filter(h => h.zone === zoneName);



                this.ui.screenDashboard.classList.add('hidden');

                this.ui.screenDashboard.classList.remove('flex');

                this.ui.screenGame.classList.remove('hidden');

                

                document.getElementById('current-zone-display').innerText = zoneName;

                this.ui.totalDisplay.innerText = `/ ${this.state.currentZoneDB.length}`;

                

                this.updateScoreDisplay(); // 기존 포획 개수 반영

                this.state.gameTargets = []; // 타겟 리셋

                this.startTracking();

            },



            updateScoreDisplay: function() {

                const userKey = `${this.state.studentId}_${this.state.studentName}`;

                const caughtIds = this.state.userProgress[userKey];

                const caughtCount = this.state.currentZoneDB.filter(h => caughtIds.includes(h.id)).length;

                this.ui.scoreDisplay.innerHTML = `${caughtCount} <span class="text-sm font-normal text-gray-300" id="total-display">/ ${this.state.currentZoneDB.length}</span>`;

            },



            startTracking: function() {

                if (navigator.geolocation) {

                    this.state.watchId = navigator.geolocation.watchPosition(

                        pos => {

                            this.state.currentLat = pos.coords.latitude;

                            this.state.currentLng = pos.coords.longitude;

                            

                            if(this.state.gameTargets.length === 0) {

                                this.state.startLat = this.state.currentLat;

                                this.state.startLng = this.state.currentLng;

                                this.generateTargets(this.state.startLat, this.state.startLng);

                                this.startTimer();

                            }



                            if(!this.state.isOutdoor) {

                                this.state.currentLat = this.state.startLat;

                                this.state.currentLng = this.state.startLng;

                                this.ui.gpsStatus.innerText = "실내 모드 (제자리 탐색)";

                            } else {

                                this.ui.gpsStatus.innerText = "GPS 걷기 모드 작동 중";

                            }

                        },

                        err => { this.ui.gpsStatus.innerText = "GPS 오류! 위치 켜주세요"; },

                        { enableHighAccuracy: true, maximumAge: 0 }

                    );

                }



                if (window.DeviceOrientationEvent) {

                    window.addEventListener('deviceorientation', e => {

                        if(this.state.isModalOpen) return;

                        let alpha = e.webkitCompassHeading != null ? e.webkitCompassHeading : Math.abs(e.alpha - 360);

                        if (alpha != null) this.state.compassHeading = alpha;

                    });

                }

                this.renderARLoop();

            },



            generateTargets: function(lat, lng) {

                const minRadius = this.state.isOutdoor ? 10 : 2;

                const maxRadius = this.state.isOutdoor ? 25 : 5;

                const userKey = `${this.state.studentId}_${this.state.studentName}`;

                const caughtIds = this.state.userProgress[userKey];



                this.state.gameTargets = this.state.currentZoneDB.map(h => {

                    // 이미 잡은 한자는 caught 상태로 생성하여 화면에 나타나지 않게 함

                    const isCaught = caughtIds.includes(h.id);

                    const angle = Math.random() * Math.PI * 2;

                    const radius = minRadius + Math.random() * (maxRadius - minRadius);

                    const latOffset = (radius * Math.cos(angle)) / 111000;

                    const lngOffset = (radius * Math.sin(angle)) / (111000 * Math.cos(lat * Math.PI / 180));

                    return { hanjaData: h, lat: lat + latOffset, lng: lng + lngOffset, caught: isCaught };

                });

            },



            startTimer: function() {

                this.state.startTime = Date.now();

                this.state.elapsedSeconds = 0;

                this.state.timerInterval = setInterval(() => {

                    this.state.elapsedSeconds = Math.floor((Date.now() - this.state.startTime) / 1000);

                    const m = String(Math.floor(this.state.elapsedSeconds / 60)).padStart(2, '0');

                    const s = String(this.state.elapsedSeconds % 60).padStart(2, '0');

                    this.ui.timerDisplay.innerText = `${m}:${s}`;

                }, 1000);

            },



            renderARLoop: function() {

                if (this.state.gameTargets.length === 0 || this.state.isModalOpen) {

                    requestAnimationFrame(this.renderARLoop.bind(this)); return;

                }



                this.ui.arContainer.innerHTML = '';

                

                this.state.gameTargets.forEach((target, index) => {

                    if (target.caught) return; // 이미 잡은 한자는 건너뜀

                    

                    const dist = GeoUtils.getDistance(this.state.currentLat, this.state.currentLng, target.lat, target.lng);

                    const visibleRadius = this.state.isOutdoor ? 20 : 10;

                    

                    if (dist <= visibleRadius) {

                        const bearing = GeoUtils.getBearing(this.state.currentLat, this.state.currentLng, target.lat, target.lng);

                        let diff = bearing - this.state.compassHeading;

                        if (diff > 180) diff -= 360; if (diff < -180) diff += 360;



                        if (Math.abs(diff) < 30) {

                            const screenX = ((diff + 30) / 60) * 100;

                            const el = document.createElement('div');

                            el.className = 'target-marker bg-white/10 backdrop-blur-sm border-2 border-yellow-400 rounded-3xl w-32 h-32 flex items-center justify-center pulse-glow';

                            el.style.left = `${screenX}%`; el.style.display = 'flex';

                            el.style.opacity = 1 - (Math.abs(diff) / 30) * 0.5;

                            el.innerHTML = `<span class="text-6xl font-black text-white">${target.hanjaData.hanja}</span>`;

                            el.onclick = () => this.catchHanja(index);

                            this.ui.arContainer.appendChild(el);

                        }

                    }

                });

                requestAnimationFrame(this.renderARLoop.bind(this));

            },



            catchHanja: function(index) {

                this.state.isModalOpen = true;

                this.ui.arContainer.innerHTML = '';

                this.state.gameTargets[index].caught = true; // 현재 세션 처리

                

                // 폰에 기록 저장 (중요)

                const userKey = `${this.state.studentId}_${this.state.studentName}`;

                const caughtId = this.state.gameTargets[index].hanjaData.id;

                if(!this.state.userProgress[userKey].includes(caughtId)) {

                    this.state.userProgress[userKey].push(caughtId);

                    localStorage.setItem('hanjaGoProgress', JSON.stringify(this.state.userProgress));

                }



                this.updateScoreDisplay();



                const hData = this.state.gameTargets[index].hanjaData;

                document.getElementById('cap-hanja').textContent = hData.hanja;

                document.getElementById('cap-hun-eum').textContent = `${hData.hun} ${hData.eum}`;

                document.getElementById('cap-busu').textContent = hData.busu;

                document.getElementById('modal-capture').classList.remove('hidden');

            },



            closeCaptureModal: function() {

                document.getElementById('modal-capture').classList.add('hidden');

                this.state.isModalOpen = false;

                

                // 구역 전체 클리어 체크

                const userKey = `${this.state.studentId}_${this.state.studentName}`;

                const caughtIds = this.state.userProgress[userKey];

                const caughtCount = this.state.currentZoneDB.filter(h => caughtIds.includes(h.id)).length;

                

                if (caughtCount >= this.state.currentZoneDB.length) {

                    this.finishZone();

                }

            },



            // 도중에 스스로 나가기 버튼

            exitZone: function() {

                clearInterval(this.state.timerInterval);

                if (this.state.watchId) navigator.geolocation.clearWatch(this.state.watchId);

                this.ui.screenGame.classList.add('hidden');

                this.showDashboard();

            },



            finishZone: function() {

                clearInterval(this.state.timerInterval);

                if (this.state.watchId) navigator.geolocation.clearWatch(this.state.watchId);

                

                this.ui.screenGame.classList.add('hidden');

                document.getElementById('screen-finish').classList.remove('hidden');

                document.getElementById('screen-finish').classList.add('flex');



                const m = Math.floor(this.state.elapsedSeconds / 60);

                const s = this.state.elapsedSeconds % 60;

                const timeString = `${m > 0 ? m + '분 ' : ''}${s}초 (이번 시도)`;

                

                const now = new Date();

                const timestampStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,'0') + "-" + String(now.getDate()).padStart(2,'0') + " " + String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0') + ":" + String(now.getSeconds()).padStart(2,'0');



                document.getElementById('finish-zone').innerText = this.state.selectedZone;

                document.getElementById('finish-elapsed').innerText = timeString;



                const url = `${SCRIPT_URL}?action=saveResult&studentId=${encodeURIComponent(this.state.studentId)}&studentName=${encodeURIComponent(this.state.studentName)}&zone=${encodeURIComponent(this.state.selectedZone)}&elapsedTime=${encodeURIComponent(timeString)}&timestamp=${encodeURIComponent(timestampStr)}`;

                

                fetch(url)

                    .then(res => res.json())

                    .then(data => {

                        document.getElementById('save-status').innerText = '선생님께 전송 완료!';

                        document.getElementById('save-status').className = 'font-bold text-green-400 text-sm';

                    })

                    .catch(err => {

                        document.getElementById('save-status').innerText = '전송 실패. 캡처해주세요.';

                        document.getElementById('save-status').className = 'font-bold text-red-400 text-sm';

                    });

            },



            returnToDashboard: function() {

                document.getElementById('screen-finish').classList.add('hidden');

                document.getElementById('screen-finish').classList.remove('flex');

                document.getElementById('save-status').innerText = '전송 중...'; // 리셋

                document.getElementById('save-status').className = 'font-bold text-blue-400 text-sm'; // 리셋

                this.showDashboard();

            }

        };



        window.onload = () => app.init();

    </script>

</body>

</html>
